<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alătură-te echipei — Herbatium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
.consentRow{display:flex;align-items:flex-start;gap:8px;margin:12px 0;font-size:13px;line-height:1.45;color:var(--ink-soft)}
.consentRow input[type=checkbox]{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--accent)}
.consentRow a{color:var(--accent)}
</style>
</head>
<body>
<div class="authCard">
  <h1>Alătură-te echipei</h1>
  <div class="sub">Ai fost invitat(ă) să te alături unui cont Herbatium. Alege o parolă ca să-ți activezi accesul — nu ai nevoie de abonament propriu.</div>
  <form id="acceptForm">
    <label for="password">Parolă (minim 8 caractere)</label>
    <input type="password" id="password" required minlength="8" autocomplete="new-password">
    <label class="consentRow" for="acceptTerms">
      <input type="checkbox" id="acceptTerms" required>
      <span>Sunt de acord cu <a href="/legal/termeni" target="_blank" rel="noopener">Termenii și condițiile</a> și am luat la cunoștință <a href="/legal/confidentialitate" target="_blank" rel="noopener">Politica de confidențialitate</a>.</span>
    </label>
    <button class="btn" type="submit" id="submitBtn">Activează accesul</button>
  </form>
  <div class="err" id="errBox"></div>
  <div class="foot">Ai deja cont? <a href="/login.html">Conectează-te</a></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token") || "";
const form = document.getElementById("acceptForm");
const errBox = document.getElementById("errBox");
const submitBtn = document.getElementById("submitBtn");

if (!token){
  errBox.textContent = "Link de invitație lipsă sau incomplet.";
  errBox.style.display = "block";
  form.style.display = "none";
}

form.onsubmit = async (e)=>{
  e.preventDefault();
  errBox.style.display = "none";
  submitBtn.disabled = true; submitBtn.textContent = "Se activează…";
  try{
    const res = await fetch("/api/auth/accept-invite", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ token, password: document.getElementById("password").value, acceptTerms: document.getElementById("acceptTerms").checked }),
    });
    if (!res.ok){
      const d = await res.json().catch(()=>({}));
      const msgs = {
        password_too_short: "Parola trebuie să aibă minim 8 caractere.",
        terms_not_accepted: "Trebuie să accepți Termenii și să iei la cunoștință Politica de confidențialitate.",
        invite_invalid_or_expired: "Linkul de invitație nu mai e valabil — cere unul nou de la contul principal.",
        owner_not_found: "Contul care te-a invitat nu mai există.",
        email_taken: "Există deja un cont cu acest email — încearcă să te conectezi.",
      };
      errBox.textContent = msgs[d.error] || "A apărut o eroare. Încearcă din nou.";
      errBox.style.display = "block";
      submitBtn.disabled = false; submitBtn.textContent = "Activează accesul";
      return;
    }
    window.location.href = "/app.html";
  }catch(e){
    errBox.textContent = "Nu am putut contacta serverul.";
    errBox.style.display = "block";
    submitBtn.disabled = false; submitBtn.textContent = "Activează accesul";
  }
};
</script>
</body>
</html>
