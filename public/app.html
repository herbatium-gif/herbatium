<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herbatium</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#1f9d5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herbatium">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#faf6ee;
  --surface:#ffffff;
  --surface-2:#f4efe2;
  --ink:#231f17;
  --ink-soft:#7a7263;
  --line:#e9e0cd;
  --accent:#1f9d5a;
  --accent-2nd:#16803f;
  --accent-ink:#ffffff;
  --accent-soft:#e2f6ea;
  --accent-2:#f2994a;
  --accent-2-soft:#fdead2;
  --amber:#c2660c;
  --amber-soft:#fdead2;
  --danger:#dc2626;
  --danger-soft:#fee2e2;
  --ok:#1f9d5a;
  --ok-soft:#e2f6ea;
  --radius:8px;
  --shadow:0 1px 2px rgba(35,31,23,.05), 0 8px 24px -14px rgba(35,31,23,.22);
  --sidebar-bg:#fbf7ee;
  --sidebar-ink:#231f17;
  --sidebar-ink-soft:#8a8271;
  --sidebar-line:#e9e0cd;
  --sidebar-active-bg:#e2f6ea;
  --sidebar-active-ink:#16803f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15190f;
    --surface:#1c2216;
    --surface-2:#212a1a;
    --ink:#f1ede4;
    --ink-soft:#a8a190;
    --line:#2c3423;
    --accent:#34c17a;
    --accent-2nd:#6ee7a8;
    --accent-ink:#0e1a0f;
    --accent-soft:#1c3524;
    --accent-2:#ffab5e;
    --accent-2-soft:#3a2a13;
    --amber:#ffb020;
    --amber-soft:#3a2b0d;
    --danger:#f87171;
    --danger-soft:#3a1518;
    --ok:#34c17a;
    --ok-soft:#173327;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
    --sidebar-bg:#0d120a;
    --sidebar-ink:#d9e4d0;
    --sidebar-ink-soft:#7f8f74;
    --sidebar-line:#1e2618;
    --sidebar-active-bg:#1c3524;
    --sidebar-active-ink:#ffffff;
  }
}
:root[data-theme="dark"]{
  --bg:#15190f;
  --surface:#1c2216;
  --surface-2:#212a1a;
  --ink:#f1ede4;
  --ink-soft:#a8a190;
  --line:#2c3423;
  --accent:#34c17a;
  --accent-2nd:#6ee7a8;
  --accent-ink:#0e1a0f;
  --accent-soft:#1c3524;
  --accent-2:#ffab5e;
  --accent-2-soft:#3a2a13;
  --amber:#ffb020;
  --amber-soft:#3a2b0d;
  --danger:#f87171;
  --danger-soft:#3a1518;
  --ok:#34c17a;
  --ok-soft:#173327;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
  --sidebar-bg:#0d120a;
  --sidebar-ink:#d9e4d0;
  --sidebar-ink-soft:#7f8f74;
  --sidebar-line:#1e2618;
  --sidebar-active-bg:#1c3524;
  --sidebar-active-ink:#ffffff;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  padding-inline:0;
}
h1,h2,h3{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

.app{display:flex;min-height:100%;max-width:1440px;margin:0 auto}
.sidebar{
  width:228px;flex:none;padding:20px 12px;background:var(--sidebar-bg);
  display:flex;flex-direction:column;gap:2px;min-height:100vh;
}
.brand{padding:6px 10px 18px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--sidebar-line);margin-bottom:12px}
.brand .mark{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--sidebar-ink);display:flex;align-items:center;gap:8px}
.brand .mark::before{content:"";width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--accent-2),var(--accent));flex:none;box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.brand .sub{font-size:11px;color:var(--sidebar-ink-soft);padding-left:17px}
.syncBadge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sidebar-ink-soft);padding:10px 10px 2px;margin-top:auto;border-top:1px solid var(--sidebar-line)}
.syncDot{width:6px;height:6px;border-radius:99px;background:var(--sidebar-ink-soft);flex:none}
.syncDot.on{background:var(--accent-2);box-shadow:0 0 0 3px var(--accent-2-soft)}
.syncDot.pending{background:var(--amber)}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;border:none;
  background:transparent;color:var(--sidebar-ink-soft);text-align:left;font-size:13px;font-weight:500;
  position:relative;
}
.navbtn .n{
  width:20px;height:20px;border-radius:5px;background:var(--sidebar-line);color:var(--sidebar-ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-family:'IBM Plex Mono',monospace;flex:none;
}
.navbtn.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-ink);box-shadow:inset 2.5px 0 0 var(--accent-2)}
.navbtn.active .n{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff}
.navbtn:hover:not(.active){background:var(--sidebar-line);color:var(--sidebar-ink)}

.main{flex:1;min-width:0;padding:26px 30px 60px;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.pageTitle{font-size:20px;font-weight:700;letter-spacing:-.01em}
.pageDesc{color:var(--ink-soft);font-size:13px;margin-top:6px;margin-bottom:22px;max-width:68ch}

.mobiletabs{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:60px}

.btn{
  padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,var(--accent-2) 0%,var(--accent) 100%);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border-radius:5px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);letter-spacing:.01em}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.twrap{overflow-x:auto;border-radius:var(--radius);overflow:hidden}

.ingRow{cursor:pointer}
.ingRow:hover{background:var(--surface-2)}
.hint{color:var(--ink-soft);font-size:12px}
.empty{color:var(--ink-soft);font-size:13px;padding:20px;text-align:center}

.searchbar{position:relative}
.searchbar input{padding-left:32px}
.searchbar svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5}

.detailPanel{position:sticky;top:16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-soft)}
.kv .v{text-align:right;max-width:60%;font-weight:500}

.recipeItem{display:grid;grid-template-columns:1fr 90px 70px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.recipeItem:last-child{border-bottom:none}
.recipeItem .nm{font-weight:600;font-size:13px}
.recipeItem .inci{font-size:11px;color:var(--ink-soft);font-style:italic}

.barTrack{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.barFill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.barFill.over{background:var(--danger)}

.label-sheet{
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:18px;
  font-family:'Plus Jakarta Sans',sans-serif;width:100%;max-width:380px;
}
:root[data-theme="dark"] .label-sheet, @media (prefers-color-scheme:dark){}
.label-sheet .lname{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;margin-bottom:2px}
.label-sheet .ltag{font-size:11px;color:var(--ink-soft);margin-bottom:10px}
.label-sheet .linci{font-size:10.5px;line-height:1.55;margin-bottom:10px}
.label-sheet .lwarn{font-size:10px;background:var(--amber-soft);color:var(--amber);padding:6px 8px;border-radius:5px;margin-bottom:8px}
.label-sheet .lmeta{font-size:10px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;display:flex;justify-content:space-between}
.label-sheet .lqr{width:64px;margin-top:8px}
.label-sheet .lqr svg{width:100%;height:auto;display:block}

.statTile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;position:relative;overflow:hidden}
.statTile::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.statTile .num{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.statTile .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:3px;text-transform:uppercase;letter-spacing:.03em}

.journalItem{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.journalItem:last-child{border-bottom:none}

.prodGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prodCard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s ease,box-shadow .12s ease}
.prodCard:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(14,19,32,.06), 0 16px 32px -16px rgba(14,19,32,.3)}
.prodThumb{aspect-ratio:1/1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.prodThumb img{width:100%;height:100%;object-fit:cover}
.prodThumb .ph{color:var(--ink-soft);font-size:11px;text-align:center;padding:8px}
.prodBody{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.prodName{font-weight:600;font-size:13px}
.prodPrice{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--accent)}
.photoStrip{display:flex;flex-wrap:wrap;gap:8px}
.photoThumb{position:relative;width:78px;height:78px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.photoThumb img{width:100%;height:100%;object-fit:cover;display:block}
.photoThumb .rm{position:absolute;top:2px;right:2px;background:rgba(10,13,21,.7);color:#fff;border:none;border-radius:99px;width:18px;height:18px;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}
.uploadTile{width:78px;height:78px;border-radius:7px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:20px;flex:none;background:var(--surface-2)}
.uploadTile input{display:none}

.select-recipe{max-width:280px}

.recipeChips{display:flex;flex-wrap:wrap;gap:8px}
.recipeChip{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:8px 13px;border-radius:var(--radius-sm,10px);border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);cursor:pointer;text-align:left;
  transition:border-color .12s ease,background .12s ease,box-shadow .12s ease,transform .1s ease;
}
.recipeChip:hover{border-color:var(--accent-2);transform:translateY(-1px)}
.recipeChip .rcName{font-size:12.5px;font-weight:700}
.recipeChip .rcMeta{font-size:10.5px;color:var(--ink-soft)}
.recipeChip.active{
  background:linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft));
  border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 8px 18px -10px var(--glow, rgba(79,70,229,.3));
}
.recipeChip.active .rcName{color:var(--accent)}

@media (max-width:860px){
  .app{flex-direction:column}
  .sidebar{display:none}
  .mobiletabs{
    display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:env(safe-area-inset-top,0px);background:var(--sidebar-bg);z-index:5;
  }
  .mobiletabs button{
    flex:none;padding:7px 12px;border-radius:6px;border:1px solid var(--sidebar-line);background:var(--sidebar-active-bg);
    font-size:12px;color:var(--sidebar-ink-soft);font-weight:600;
  }
  .mobiletabs button.active{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;border-color:transparent}
  .main{padding:18px 16px 50px}
}

.customForm{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.toggleLink{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px}

.printOnlyBlock{display:none}
.recipeSheet{background:#ffffff;color:#0e1320;border:1px solid var(--line);border-radius:8px;padding:20px;font-family:'Plus Jakarta Sans',sans-serif}
.recipeSheet h2{font-size:20px;margin-bottom:2px}
.recipeSheet table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.recipeSheet th,.recipeSheet td{text-align:left;padding:5px 8px;border-bottom:1px solid #dde1ea}

@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{position:absolute;top:0;left:0;width:100%;margin:0;padding:0;box-shadow:none;border:none}
  #printArea.printOnlyBlock{display:block !important}
  .label-sheet{max-width:100%;border:none;box-shadow:none}
  .recipeSheet{border:none;box-shadow:none}
}

/* ===== polish pass: ambient depth, glow, motion ===== */
:root{
  --glow:rgba(31,157,90,.18);
  --glow-2:rgba(242,153,74,.16);
  --mesh-1:rgba(31,157,90,.12);
  --mesh-2:rgba(242,153,74,.10);
  --mesh-3:rgba(31,157,90,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --glow:rgba(52,193,122,.32);
    --glow-2:rgba(255,171,94,.26);
    --mesh-1:rgba(52,193,122,.18);
    --mesh-2:rgba(255,171,94,.14);
    --mesh-3:rgba(52,193,122,.10);
  }
}
:root[data-theme="dark"]{
  --glow:rgba(52,193,122,.32);
  --glow-2:rgba(255,171,94,.26);
  --mesh-1:rgba(52,193,122,.18);
  --mesh-2:rgba(255,171,94,.14);
  --mesh-3:rgba(52,193,122,.10);
}

*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-soft)}
::selection{background:var(--accent);color:var(--accent-ink)}

.main{
  background-image:
    radial-gradient(760px circle at 12% -8%, var(--mesh-1), transparent 55%),
    radial-gradient(620px circle at 100% 0%, var(--mesh-2), transparent 50%),
    radial-gradient(900px circle at 30% 120%, var(--mesh-3), transparent 55%);
  background-attachment:fixed;
}
.sidebar{
  background-image:radial-gradient(420px circle at 18px 0%, rgba(99,102,241,.22), transparent 60%);
  background-repeat:no-repeat;
  position:relative;
}
.sidebar::after{
  content:"";position:absolute;top:0;right:0;bottom:0;width:1px;
  background:linear-gradient(180deg, var(--sidebar-line), transparent 70%, var(--sidebar-line));
}

.brand .mark{
  background:linear-gradient(90deg, var(--sidebar-ink) 0%, var(--accent-2) 45%, var(--accent) 65%, var(--sidebar-ink) 100%);
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:markShimmer 7s ease-in-out infinite;
}
@keyframes markShimmer{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@media (prefers-reduced-motion: reduce){.brand .mark{animation:none}}

.card{transition:border-color .15s ease, box-shadow .18s ease, transform .15s ease}
.card:hover{box-shadow:var(--shadow), 0 0 0 1px var(--line), 0 10px 30px -12px var(--glow)}

.navbtn{transition:background .12s ease, color .12s ease, box-shadow .12s ease}
.navbtn.active{box-shadow:inset 2.5px 0 0 var(--accent-2), 0 0 22px -6px var(--glow)}

.btn.primary{box-shadow:0 1px 2px rgba(0,0,0,.08), 0 8px 20px -8px var(--glow);transition:filter .12s ease, box-shadow .12s ease, transform .1s ease}
.btn.primary:hover{box-shadow:0 1px 2px rgba(0,0,0,.1), 0 10px 26px -8px var(--glow);transform:translateY(-1px)}
.btn.primary:active{transform:translateY(0)}

.statTile{transition:box-shadow .15s ease, transform .15s ease}
.statTile:hover{box-shadow:var(--shadow), 0 0 24px -10px var(--glow);transform:translateY(-1px)}

.syncDot.on{box-shadow:0 0 0 3px var(--accent-2-soft), 0 0 10px var(--glow-2)}

input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{
  box-shadow:0 0 0 3px var(--accent-soft);
}

.prodCard:hover{box-shadow:0 1px 2px rgba(14,19,32,.06), 0 18px 36px -16px var(--glow)}

.topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.topbar .email{font-size:12.5px;color:var(--ink-soft);margin-right:auto}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center}
body{background:var(--bg);color:var(--ink);margin:0}

/* ===== v2 modern refresh: softer geometry, depth, richer stat cards ===== */
:root{
  --radius:14px;
  --radius-lg:18px;
  --radius-sm:10px;
}
.topbar{
  backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
  background:color-mix(in srgb, var(--surface) 78%, transparent);
  border-bottom:1px solid var(--line);
}

.pageTitle{
  position:relative;padding-bottom:12px;font-size:22px;
}
.pageTitle::after{
  content:"";position:absolute;left:0;bottom:0;width:38px;height:3px;border-radius:99px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
}
.pageDesc{margin-top:16px}

.card{border-radius:var(--radius-lg);border-color:color-mix(in srgb, var(--line) 80%, transparent)}
.card > .pad > h3{
  display:flex;align-items:center;gap:8px;letter-spacing:-.01em;
}
.card > .pad > h3::before{
  content:"";width:7px;height:7px;border-radius:99px;flex:none;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));

/* ---- Poze produse: redimensionare + stocare pe server (contul tău) ---- */
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("Nu am putut citi fișierul."));
    reader.onload = ()=>{
      img.onerror = ()=>reject(new Error("Fișier imagine invalid."));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w>maxDim || h>maxDim){
          if (w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob=>{
          if (!blob) return reject(new Error("Conversie eșuată."));
          resolve(blob);
        }, "image/jpeg", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addPhotoToProduct(productId, file){
  const product = products.find(p=>p.id===productId);
  if (!product) return;
  state.photoBusy = true; renderMain();
  try{
    const resized = await resizeImageFile(file, 1000);
    const fd = new FormData();
    fd.append("photo", resized, "photo.jpg");
    const res = await fetch("/api/photos", { method:"POST", credentials:"same-origin", body: fd });
    if (!res.ok) throw new Error("Încărcare eșuată.");
    const d = await res.json();
    product.photos.push({id: d.id, url: d.url});
    persistProducts();
  }catch(e){
    alert("Nu am putut adăuga poza: "+e.message);
  }
  state.photoBusy = false; renderMain();
}
function deletePhotoFile(url){
  const filename = (url||"").split("/").pop();
  if (!filename) return Promise.resolve();
  return api("/photos/"+filename, {method:"DELETE"}).catch(()=>{});
}
function removePhotoFromProduct(productId, photoId){
  const product = products.find(p=>p.id===productId);
  if (!product) return;
  const photo = product.photos.find(ph=>ph.id===photoId);
  product.photos = product.photos.filter(ph=>ph.id!==photoId);
  persistProducts(); renderMain();
  if (photo) deletePhotoFile(photo.url);
}

  renderMobileTabs();
  renderMain();
}

function renderSidebar(){
  const nav = document.getElementById("sidebar");
  nav.innerHTML = `<div class="brand"><div class="mark">Herbatium</div><div class="sub">pentru cosmetică naturală</div></div>` +
    TABS.map(t=>`<button class="navbtn ${state.tab===t.id?'active':''}" data-tab="${t.id}"><span class="n">${t.n}</span>${t.label}</button>`).join("") +
    syncBadgeHtml();
  nav.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render();});
}
function syncBadgeHtml(){
  if (cloud.status==="on") return `<div class="syncBadge"><span class="syncDot on"></span>Sincronizat în contul tău — vezi datele pe orice dispozitiv</div>`;
  if (cloud.status==="pending") return `<div class="syncBadge"><span class="syncDot pending"></span>Se sincronizează…</div>`;
  if (cloud.status==="error") return `<div class="syncBadge"><span class="syncDot"></span>Doar pe acest dispozitiv (sincronizarea nu a pornit)</div>`;
  return `<div class="syncBadge"><span class="syncDot"></span>Doar pe acest dispozitiv</div>`;
}
function renderMobileTabs(){
  const m = document.getElementById("mobiletabs");
  m.innerHTML = TABS.map(t=>`<button class="${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join("");
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render();});
}

function captureFocus(container){
  const active = document.activeElement;
  if (!active || !container.contains(active)) return null;
  const tag = active.tagName;
  if (tag!=="INPUT" && tag!=="TEXTAREA" && tag!=="SELECT") return null;
  let selStart = null, selEnd = null;
  try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){ /* type="number" etc. doesn't support selection */ }
  return {
    id: active.id || null,
    cls: active.className || "",
    dataItem: active.dataset ? (active.dataset.item || null) : null,
    dataIng: active.dataset ? (active.dataset.ing || null) : null,
    selStart, selEnd,
  };
}
function restoreFocus(container, info){
  if (!info) return;
  let el = null;
  if (info.id){
    el = document.getElementById(info.id);
  } else if (info.cls && (info.dataItem || info.dataIng)){
    const clsSel = "." + info.cls.trim().split(/\s+/).map(c=>CSS.escape(c)).join(".");
    const attrSel = info.dataItem ? `[data-item="${CSS.escape(info.dataItem)}"]` : `[data-ing="${CSS.escape(info.dataIng)}"]`;
    el = container.querySelector(clsSel + attrSel);
  }
  if (!el) return;
  el.focus();
  if (info.selStart!=null && info.selEnd!=null && typeof el.setSelectionRange==="function"){
    try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){ /* selection not supported on this input type */ }
  }
}
function renderMain(){
  const main = document.getElementById("main");
  const focusInfo = captureFocus(main);
  if (state.tab==="dashboard") main.innerHTML = viewDashboard();
  else if (state.tab==="ingrediente") main.innerHTML = viewIngrediente();
  else if (state.tab==="reteta") main.innerHTML = viewReteta();
  else if (state.tab==="lesie") main.innerHTML = viewLesie();
  else if (state.tab==="eticheta") main.innerHTML = viewEticheta();
  else if (state.tab==="cost") main.innerHTML = viewCost();
  else if (state.tab==="jurnal") main.innerHTML = viewJurnal();
  else if (state.tab==="produse") main.innerHTML = viewProduse();
  else if (state.tab==="stoc") main.innerHTML = viewStoc();
  else if (state.tab==="rapoarte") main.innerHTML = viewRapoarte();
  else if (state.tab==="resurse") main.innerHTML = viewResurse();
  else if (state.tab==="pagina-publica") main.innerHTML = viewPaginaPublica();
  else if (state.tab==="ajutor") main.innerHTML = viewAjutor();
  else if (state.tab==="cont") main.innerHTML = viewCont();
  wireEvents();
  restoreFocus(main, focusInfo);
}

        shortages.map(s=>`<div class="kv"><span class="k">${escHtml(s.ing)} — ${escHtml(s.recipe)}</span><span class="v"><span class="chip danger">${fmt(s.have)}g / ${fmt(s.needed)}g necesare</span></span></div>`).join("")}
    </div></div>

    <div class="card"><div class="pad stack">

        belowMin.map(x=>`<div class="kv"><span class="k">${escHtml(x.ing.ro)}</span><span class="v"><span class="chip amber">${fmt(x.st.qty)}g / prag ${fmt(x.st.minQty)}g</span></span></div>`).join("")}

    .sort((a,b)=> (b.st.qty>0)-(a.st.qty>0) || a.ing.ro.localeCompare(b.ing.ro));

  return `

function restrictionChip(i){
  if (i.maxPct!=null) return `<span class="chip amber">max ${i.maxPct}%</span>`;
  if (i.alergen) return `<span class="chip amber">alergen declarabil</span>`;
  return `<span class="chip">fără restricție</span>`;
}

function renderRecipeSheet(r, totals){
  const rows = sortedItems(r).map(it=>{
    const ing = findIng(it.ingId);
    const pct = totals.total>0 ? (it.grams/totals.total*100) : 0;
    return {ing, it, pct};
  });
  const totalCost = r.items.reduce((s,it)=> s + (it.grams/1000)*Number(it.price||defaultPrice(it.ingId)||0), 0);
  return `
  <div class="recipeSheet">
    <h2>${escHtml(r.name)}</h2>
    <div class="hint">${r.type==='leave-on'?'Produs leave-on':'Produs rinse-off'} · masă totală ${fmt(totals.total)}g · generat ${todayISO()}</div>
    <table>
      <thead><tr><th>Ingredient</th><th>INCI</th><th>g</th><th>%</th></tr></thead>
      <tbody>
        ${rows.map(({ing,it,pct})=>`<tr><td>${ing?ing.ro:'?'}</td><td><i>${ing?ing.inci:''}</i></td><td>${fmt(it.grams)}</td><td>${pct.toFixed(2)}%</td></tr>`).join("")}
      </tbody>
    </table>
    <div class="hint">Cost estimat materie primă: ${totalCost.toFixed(2)} lei (la prețurile salvate curent)</div>
    ${r.notes ? `<div class="hint" style="margin-top:8px"><strong>Notițe:</strong> ${escHtml(r.notes)}</div>` : ""}
  </div>`;
}
function renderRecipeItem(it, totals){
  const ing = findIng(it.ingId);
  const pct = totals.total>0 ? (it.grams/totals.total*100) : 0;
  const over = ing && ing.maxPct!=null && pct > ing.maxPct;
  const st = ing ? stockOf(ing.id) : null;
  const lowStock = st && st.qty>0 && st.qty < it.grams;
  return `
  <div class="recipeItem" data-item="${it.id}">
    <div>
      <div class="nm">${ing?ing.ro:'Ingredient necunoscut'}</div>
      <div class="inci">${ing?ing.inci:''}</div>
      <div class="barTrack"><div class="barFill ${over?'over':''}" style="width:${Math.min(100,pct*3)}%"></div></div>
      ${lowStock ? `<div class="chip danger" style="margin-top:4px">stoc insuficient: ${fmt(st.qty)}g din ${fmt(it.grams)}g necesare</div>` : ""}
    </div>
    <div class="mono" style="text-align:right;font-size:12.5px">${pct.toFixed(2)}%</div>
    <input type="number" class="itemGrams" data-item="${it.id}" value="${it.grams}" min="0" step="0.1" style="padding:6px 8px">
    <button class="btn sm ghost danger itemRemove" data-item="${it.id}" title="Elimină">✕</button>
  </div>`;
}
function sortedItems(r){
  return [...r.items].sort((a,b)=>b.grams-a.grams);
}
function computeTotals(r){
  const total = r.items.reduce((s,it)=>s+Number(it.grams||0),0);
  let flags = 0;
  let apaFree = true;
  r.items.forEach(it=>{
    const ing = findIng(it.ingId);
    if (!ing) return;
    if (ing.faza==='apa') apaFree = false;
    const pct = total>0 ? it.grams/total*100 : 0;
    if (ing.maxPct!=null && pct>ing.maxPct) flags++;
    if (ing.alergen){
      const threshold = r.type==='rinse-off' ? ALERGEN_THRESHOLD_RINSE_OFF : ALERGEN_THRESHOLD_LEAVE_ON;
      if (pct > threshold) flags++;
    }
  });
  return {total, flags, apaFree};
}
function renderRestrictionChecks(r, totals){
  const rows = [];
  r.items.forEach(it=>{
    const ing = findIng(it.ingId);
    if (!ing) return;
    const pct = totals.total>0 ? it.grams/totals.total*100 : 0;
    if (ing.maxPct!=null){
      const over = pct > ing.maxPct;
      rows.push(`<div class="kv"><span class="k">${ing.ro}</span><span class="v"><span class="chip ${over?'danger':'accent'}">${pct.toFixed(2)}% / max ${ing.maxPct}% ${over?'— DEPĂȘIT':'OK'}</span></span></div>`);
    }
    if (ing.alergen){
      const threshold = r.type==='rinse-off' ? ALERGEN_THRESHOLD_RINSE_OFF : ALERGEN_THRESHOLD_LEAVE_ON;
      const over = pct > threshold;
      rows.push(`<div class="kv"><span class="k">${ing.ro} — alergeni</span><span class="v"><span class="chip ${over?'amber':''}">${over? 'de declarat pe etichetă' : 'sub pragul de declarare'}</span></span></div>`);
    }
  });
  if (rows.length===0) return `<div class="hint">Niciun ingredient din rețetă nu are restricții specifice de concentrație în baza de date.</div>`;
  return rows.join("") + `<p class="hint" style="margin-top:8px">Pragurile de alergeni (${ALERGEN_THRESHOLD_LEAVE_ON.toFixed(3)}% leave-on / ${ALERGEN_THRESHOLD_RINSE_OFF.toFixed(2)}% rinse-off) se aplică la conținutul real al substanței alergene, nu la ingredientul brut — pentru uleiuri esențiale, verifică fișa IFRA a furnizorului pentru compoziția exactă. Anexa III listează acum 82 de alergeni de declarat (extinsă în 2023) — ingredientele marcate mai sus sunt cele cunoscute din baza curatoriată, nu neapărat toate cele 82.</p>`;
}

/* ========================= TAB LEȘIE: CALCULATOR SAPONIFICARE ========================= */
function lyeCalc(r){
  const rows = r.items.map(it=>{
    const ing = findIng(it.ingId);
    const sap = ing ? SAP_NAOH[ing.id] : null;
    return {it, ing, sap};
  }).filter(x=>x.ing && x.ing.faza==="ulei");
  const known = rows.filter(x=>x.sap!=null);
  const unknown = rows.filter(x=>x.sap==null);
  const oilsTotal = rows.reduce((s,x)=>s+Number(x.it.grams||0),0);
  const isKOH = lyeState.type==="koh";
  const factor = isKOH ? SAP_KOH_FACTOR : 1;
  const superfat = Number(lyeState.superfat||0)/100;
  const waterPct = Number(lyeState.waterPct||0)/100;
  let lyeTotal = 0;
  const detail = known.map(x=>{
    const pureLye = x.it.grams * x.sap * factor;
    const afterSuperfat = pureLye * (1-superfat);
    lyeTotal += afterSuperfat;
    return {...x, lyeGrams: afterSuperfat};
  });
  const waterTotal = oilsTotal * waterPct;
  const batchTotal = oilsTotal + lyeTotal + waterTotal;
  return {detail, unknown, oilsTotal, lyeTotal, waterTotal, batchTotal, isKOH};
}

let costState = {units:10, margin:120, packaging:4};
function unitCostTotal(totalCost){
  return (totalCost/Math.max(1,costState.units)) + Number(costState.packaging||0);
}
function suggestedPrice(totalCost){
  return unitCostTotal(totalCost) * (1 + Number(costState.margin||0)/100);
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function suggestLotCode(){
  const n = state.batches.length+1;
  return todayISO()+"-"+String(n).padStart(2,"0");
}
function addMonths(dateISO, months){
  const d = new Date(dateISO+"T00:00:00");
  if (isNaN(d.getTime())) return null;
  d.setMonth(d.getMonth()+Number(months));
  return d.toISOString().slice(0,10);
}
function expiryChipHtml(expiryISO){
  if (!expiryISO) return "";
  const days = Math.round((new Date(expiryISO+"T00:00:00") - new Date(todayISO()+"T00:00:00"))/86400000);
  let cls = "chip accent", label = "Expiră: "+expiryISO;
  if (days<0){ cls = "chip danger"; label = "Expirat: "+expiryISO; }
  else if (days<=60){ cls = "chip amber"; label = "Expiră curând: "+expiryISO; }
  return `<span class="${cls}">${label}</span>`;
}
function yieldChipHtml(b){
  if (!b.plannedQty || !b.yieldQty) return "";
  const pct = (b.yieldQty/b.plannedQty*100);
  const cls = pct>=95 ? "chip accent" : pct>=85 ? "chip amber" : "chip danger";
  return `<span class="${cls}">Randament: ${pct.toFixed(1)}% (${fmt(b.yieldQty)}g din ${fmt(b.plannedQty)}g)</span>`;
}

/* ========================= TAB RAPOARTE: PROFITABILITATE ========================= */
function daysAgoISO(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}
function viewRapoarte(){
  const from = state.reportFrom || daysAgoISO(30);
  const to = state.reportTo || todayISO();
  const inRange = sales.filter(s=> s.date>=from && s.date<=to);

  // opțiuni de produs disponibile în perioada aleasă (după id, cu fallback pe nume)
  const productOptions = [];
  const seenKey = new Set();
  inRange.forEach(s=>{
    const key = s.productId||s.productName;
    if (!seenKey.has(key)){ seenKey.add(key); productOptions.push({key, name:s.productName||"(fără nume)"}); }
  });
  productOptions.sort((a,b)=> a.name.localeCompare(b.name));

  const productFilter = state.reportProduct || "";
  const filtered = productFilter ? inRange.filter(s=> (s.productId||s.productName)===productFilter) : inRange;

  const revenue = filtered.reduce((s,x)=>s+Number(x.total||0),0);
  const cost = filtered.reduce((s,x)=>s+Number(x.totalCost||0),0);
  const profit = revenue-cost;
  const byProduct = {};
  filtered.forEach(s=>{
    const key = s.productId||s.productName;
    if (!byProduct[key]) byProduct[key] = {name:s.productName, qty:0, revenue:0, cost:0};
    byProduct[key].qty += Number(s.qty||0);
    byProduct[key].revenue += Number(s.total||0);
    byProduct[key].cost += Number(s.totalCost||0);
  });
  const rows = Object.values(byProduct).sort((a,b)=>b.revenue-a.revenue);

  return `
  <div class="topline"><h1 class="pageTitle">Rapoarte de profitabilitate</h1></div>
  <p class="pageDesc">Calculat din vânzările înregistrate în tab-ul „Produse” (buton „Înregistrează vânzarea”). Costul e cel introdus manual la fiecare vânzare (implicit din câmpul „Cost estimat / bucată” al produsului).</p>

  <div class="card"><div class="pad">
    <div class="row">
      <div><label>De la</label><input type="text" id="reportFrom" value="${from}" placeholder="AAAA-LL-ZZ" style="max-width:130px"></div>
      <div><label>Până la</label><input type="text" id="reportTo" value="${to}" placeholder="AAAA-LL-ZZ" style="max-width:130px"></div>
      <div><label>Produs</label>
        <select id="reportProduct" style="max-width:220px">
          <option value="">Toate produsele</option>
          ${productOptions.map(p=>`<option value="${escAttr(p.key)}" ${p.key===productFilter?'selected':''}>${escHtml(p.name)}</option>`).join("")}
        </select>
      </div>
      ${productFilter ? `<button class="btn sm ghost" id="clearReportProductBtn" style="align-self:flex-end">Șterge filtrul de produs</button>` : ""}
    </div>
  </div></div>

  <div class="grid3" style="margin:16px 0">
    <div class="statTile"><div class="num">${revenue.toFixed(0)} lei</div><div class="lbl">venituri${productFilter?' (produs filtrat)':''}</div></div>
    <div class="statTile"><div class="num">${cost.toFixed(0)} lei</div><div class="lbl">cost estimat</div></div>
    <div class="statTile"><div class="num">${profit.toFixed(0)} lei</div><div class="lbl">profit estimat</div></div>
  </div>

  <div class="card"><div class="pad">
    <h3 style="font-size:14px;margin-bottom:8px">Pe produs (${filtered.length} vânzări în perioadă${productFilter?', filtrat':''})</h3>
    ${rows.length===0 ? `<div class="empty">Nicio vânzare înregistrată în această perioadă${productFilter?' pentru produsul ales':''}.</div>` : `
    <div class="twrap"><table>

/* ========================= EVENTS ========================= */
function wireEvents(){
  // Dashboard
  const exportBackupBtn = document.getElementById("exportBackupBtn");
  if (exportBackupBtn) exportBackupBtn.onclick = exportBackup;
  const sendInviteBtn = document.getElementById("sendInviteBtn");
  if (sendInviteBtn) sendInviteBtn.onclick = async ()=>{
    const email = (document.getElementById("teamInviteEmail").value||"").trim();
    state.teamInviteError = ""; state.teamInviteUrl = "";
    if (!email){ state.teamInviteError = "Introdu un email."; renderMain(); return; }
    sendInviteBtn.disabled = true;
    try{
      const res = await api("/auth/invite", {method:"POST", body: JSON.stringify({email})});
      const d = await res.json().catch(()=>({}));
      if (res.ok){ state.teamInviteUrl = d.inviteUrl; }
      else{
        const msgs = {email_invalid:"Adresa de email nu pare validă.", email_taken:"Există deja un cont cu acest email.", already_a_member:"Un membru de echipă nu poate invita alți membri."};
        state.teamInviteError = msgs[d.error] || "Nu am putut genera invitația.";
      }
    }catch(e){ state.teamInviteError = "Nu am putut contacta serverul."; }
    renderMain();
  };
  const copyInviteBtn = document.getElementById("copyInviteBtn");
  if (copyInviteBtn) copyInviteBtn.onclick = ()=>{
    try{ navigator.clipboard.writeText(state.teamInviteUrl); copyInviteBtn.textContent = "Copiat ✓"; setTimeout(()=>{ copyInviteBtn.textContent = "Copiază linkul"; },1500); }catch(e){}
  };
  const importBackupInput = document.getElementById("importBackupInput");
  if (importBackupInput) importBackupInput.onchange = e=>{
    const file = e.target.files[0];
    if (file) importBackup(file);
    importBackupInput.value = "";
  };

  // Ingrediente
  const ingSearchInput = document.getElementById("ingSearchInput");
  if (ingSearchInput){
    ingSearchInput.oninput = e=>{ state.ingSearch = e.target.value; renderMain(); ingSearchInput.focus(); ingSearchInput.setSelectionRange(ingSearchInput.value.length, ingSearchInput.value.length); };
  }

  // Stoc (tabel inline)
  document.querySelectorAll(".stockRowQty").forEach(inp=>{
    inp.oninput = e=>{
      const id = inp.dataset.ing;
      stock[id] = {...stockOf(id), qty: Number(e.target.value||0)};
      persistStock(); renderMain();
    };
  });
  document.querySelectorAll(".stockRowSupplier").forEach(inp=>{
    inp.onchange = e=>{
      const id = inp.dataset.ing;

      let updated = 0, skipped = 0;
      for (let i=1;i<rows.length;i++){
        const row = rows[i];
        if (row.length<2) continue;
        const id = idx("id")>=0 ? row[idx("id")] : null;
        const nume = idx("nume")>=0 ? row[idx("nume")] : null;

        const cur = stockOf(ing.id);
        stock[ing.id] = {
          qty: idx("stoc_g")>=0 ? Number(row[idx("stoc_g")]||0) : cur.qty,
          minQty: idx("prag_minim_g")>=0 ? Number(row[idx("prag_minim_g")]||0) : cur.minQty,
          supplier: idx("furnizor")>=0 ? row[idx("furnizor")] : cur.supplier,
          lot: idx("lot")>=0 ? row[idx("lot")] : cur.lot,
        };
        if (idx("pret_lei_kg")>=0){
          const price = Number(row[idx("pret_lei_kg")]||0);
          if (price>0) ingredientPrices[ing.id] = price;
        }
        updated++;
      }
      persistStock(); persistPrices(); renderMain();

          <button class="btn sm" id="confirmDeleteBtn" style="background:#e5484d;border-color:#e5484d">Confirmă ștergerea definitivă</button>
          <button class="btn sm ghost" id="cancelDeleteBtn">Renunță</button>
        </div>
      </div>`;
    document.getElementById("cancelDeleteBtn").onclick = ()=>{ renderMain(); };
    document.getElementById("confirmDeleteBtn").onclick = async ()=>{
      const password = document.getElementById("deletePassword").value;
      const errBox = document.getElementById("deleteAccountErr");
      errBox.style.display = "none";
      if (!password){ errBox.textContent = "Introdu parola contului."; errBox.style.display="block"; return; }
      if (!confirm("Sigur vrei să ștergi definitiv contul și toate datele asociate? Acțiunea nu poate fi anulată.")) return;
      try{
        const res = await api("/account", {method:"DELETE", body: JSON.stringify({password})});
        const d = await res.json().catch(()=>({}));
        if (res.ok){ window.location.href = "/login.html"; return; }
        const msgs = {
          password_required: "Introdu parola contului.",
          wrong_password: "Parola e greșită.",
          team_members_exist: "Ai membri de echipă activi — scoate-i din echipă înainte de a șterge contul principal" + (d.membri&&d.membri.length ? " ("+d.membri.join(", ")+")." : "."),
        };
        errBox.textContent = msgs[d.error] || "Nu am putut șterge contul. Încearcă din nou.";
        errBox.style.display = "block";
      }catch(err){
        errBox.textContent = "Nu am putut contacta serverul.";
        errBox.style.display = "block";
      }
    };
  };
}

/* ========================= UTIL ========================= */
function fmt(n){ return (Math.round(n*100)/100).toString(); }
function escHtml(s){ return String(s==null?"":s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escAttr(s){ return escHtml(s).replace(/"/g,"&quot;"); }

/* Cod QR — generat local (fără server extern), cu librăria inline "qrcode-lib.js". */
function makeQrSvg(text){
  if (!text || typeof qrcode!=="function") return "";
  try{
    const qr = qrcode(0, "M");
    qr.addData(String(text));
    qr.make();
    return qr.createSvgTag({cellSize:4, margin:2, scalable:true});
  }catch(e){
    return "";
  }
}

function downloadText(filename, content, mime){
  const blob = new Blob([content], {type: mime||"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function csvField(v){
  const s = v==null ? "" : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows){
  return rows.map(row=>row.map(csvField).join(",")).join("\r\n");
}
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* ignore, \n handles line breaks */ }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0]===""));
}

/* ===== Import / Export universal (Excel .xlsx + CSV) pentru ingrediente și elemente de rețetă =====
   - "Exportă șablon" descarcă doar antetul de coloane (formatat, gata de completat în Excel).
   - "Importă" citește .xlsx / .xls / .csv, potrivește coloanele după numele din antet (ignoră diacritice/majuscule)
     și NU suprapune: ingredientele existente (după INCI sau nume) și elementele deja prezente într-o rețetă sunt ignorate, nu duplicate. */
function normText(s){
  return String(s==null?"":s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
}
function downloadXlsxTemplate(filename, sheetName, headers){
  if (typeof XLSX==="undefined"){ alert("Modulul Excel nu s-a încărcat; reîmprospătează pagina și încearcă din nou."); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  ws['!cols'] = headers.map(h=>({wch: Math.max(16, String(h).length+3)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
  XLSX.writeFile(wb, filename);
}
// La fel ca downloadXlsxTemplate, dar scrie și datele (nu doar antetul) —
// folosit pentru exporturile reale (Stoc, Rețetă), nu doar pentru șabloane goale.
function downloadXlsxData(filename, sheetName, headers, rows){
  if (typeof XLSX==="undefined"){ alert("Modulul Excel nu s-a încărcat; reîmprospătează pagina și încearcă din nou."); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = headers.map((h,i)=>{
    const maxLen = rows.reduce((m,r)=>Math.max(m, String(r[i]==null?"":r[i]).length), String(h).length);
    return { wch: Math.max(12, Math.min(40, maxLen+3)) };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
  XLSX.writeFile(wb, filename);
}
function readImportFile(file, onRows){
  const name = (file.name||"").toLowerCase();
  const reader = new FileReader();
  reader.onerror = ()=> alert("Nu am putut citi fișierul.");
  if (name.endsWith(".csv")){
    reader.onload = ()=>{
      try{ onRows(parseCSV(String(reader.result))); }
      catch(err){ alert("Nu am putut citi fișierul CSV: "+err.message); }
    };
    reader.readAsText(file);
  } else {
    reader.onload = ()=>{
      try{
        if (typeof XLSX==="undefined") throw new Error("modulul Excel nu s-a încărcat");
        const wb = XLSX.read(new Uint8Array(reader.result), {type:"array"});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""})
          .map(r=>r.map(c=>String(c==null?"":c)));
        onRows(rows);
      }catch(err){
        alert("Nu am putut citi fișierul Excel (.xlsx/.xls): "+err.message+"\n\nFormate acceptate la import: .xlsx, .xls, .csv.");
      }
    };
    reader.readAsArrayBuffer(file);
  }
}
/* caută indexul unei coloane în antet, tolerant la diacritice/majuscule/paranteze */
function findColIdx(header, ...variants){
  for (const v of variants){
    const target = normText(v);
    let i = header.findIndex(h=> h===target);
    if (i>=0) return i;
    i = header.findIndex(h=> h.includes(target) || target.includes(h));
    if (i>=0) return i;
  }
  return -1;
}

const INGREDIENT_IMPORT_HEADERS = ["Nume (uzual)","INCI","Categorie","Faza (ulei/apa/pulbere/tehnic)","Concentratie max. % (optional)","Functie","Alergen parfum (DA/NU)","Nota / sursa"];
function exportIngredientTemplate(){
  downloadXlsxTemplate("sablon-import-ingrediente.xlsx", "Ingrediente", INGREDIENT_IMPORT_HEADERS);
}
function importIngredientRows(rows){
  if (!rows || rows.length<2){ alert("Fișierul nu are rânduri de importat (doar antetul sau e gol)."); return; }
  const header = rows[0].map(normText);
  const iNume = findColIdx(header, "Nume (uzual)","nume","nume ro");
  const iInci = findColIdx(header, "INCI","denumire inci");
  const iCat = findColIdx(header, "Categorie");
  const iFaza = findColIdx(header, "Faza (ulei/apa/pulbere/tehnic)","faza");
  const iPrag = findColIdx(header, "Concentratie max. % (optional)","concentratie max","prag maxim");
  const iFunctie = findColIdx(header, "Functie");
  const iAlergen = findColIdx(header, "Alergen parfum (DA/NU)","alergen");
  const iNota = findColIdx(header, "Nota / sursa","nota");

  let added=0, duplicate=0, invalid=0;
  const existing = allIngredients();
  const seenInci = new Set(existing.map(x=>normText(x.inci)));
  const seenNume = new Set(existing.map(x=>normText(x.ro)));
  for (let i=1;i<rows.length;i++){
    const row = rows[i];
    if (!row || row.every(c=>String(c||"").trim()==="")) continue;
    const ro = iNume>=0 ? String(row[iNume]||"").trim() : "";
    const inci = iInci>=0 ? String(row[iInci]||"").trim() : "";
    if (!ro || !inci){ invalid++; continue; }
    if (seenInci.has(normText(inci)) || seenNume.has(normText(ro))){ duplicate++; continue; }
    const faza = iFaza>=0 ? normText(row[iFaza]) : "";
    const pragRaw = iPrag>=0 ? String(row[iPrag]||"").trim().replace(",",".") : "";
    const prag = pragRaw ? Number(pragRaw) : NaN;
    const alergenRaw = iAlergen>=0 ? normText(row[iAlergen]) : "";
    const newIng = {
      id: "custom-"+uid(),
      ro, inci,
      cat: iCat>=0 ? (String(row[iCat]||"").trim() || "Ingredient personalizat") : "Ingredient personalizat",
      faza: ["ulei","apa","pulbere","tehnic"].includes(faza) ? faza : "tehnic",
      functie: iFunctie>=0 ? (String(row[iFunctie]||"").trim() || "—") : "—",
      maxPct: (!isNaN(prag) && prag>0) ? prag : null,
      alergen: alergenRaw==="da" || alergenRaw==="yes" || alergenRaw==="true" || alergenRaw==="1",
      nota: iNota>=0 ? String(row[iNota]||"").trim() : "",
      custom: true,
    };
    customIngredients.push(newIng);
    seenInci.add(normText(inci)); seenNume.add(normText(ro));
    added++;
  }
  persistCustom();
  renderMain();
  alert(`Import ingrediente finalizat:\n• ${added} adăugate\n• ${duplicate} deja existente în bază (ignorate, ca să nu se suprapună)\n• ${invalid} rânduri incomplete (fără nume sau INCI, ignorate)`);
}

const RECIPE_ITEM_IMPORT_HEADERS = ["Ingredient (nume uzual sau INCI)","Grame"];
function exportRecipeItemTemplate(){
  downloadXlsxTemplate("sablon-import-ingrediente-reteta.xlsx", "Ingrediente reteta", RECIPE_ITEM_IMPORT_HEADERS);
}
function importRecipeItemRows(rows){
  if (!rows || rows.length<2){ alert("Fișierul nu are rânduri de importat (doar antetul sau e gol)."); return; }
  const r = activeRecipe();
  const header = rows[0].map(normText);
  const iIng = findColIdx(header, "Ingredient (nume uzual sau INCI)","ingredient","nume");
  const iGrame = findColIdx(header, "Grame","gr","grame (g)");

  const all = allIngredients();
  const inRecipe = new Set(r.items.map(it=>it.ingId));
  let added=0, duplicate=0, unknown=0, invalid=0;
  const unknownNames = [];
  for (let i=1;i<rows.length;i++){
    const row = rows[i];
    if (!row || row.every(c=>String(c||"").trim()==="")) continue;
    const name = iIng>=0 ? String(row[iIng]||"").trim() : (row[0]||"").trim();
    const gramsRaw = iGrame>=0 ? String(row[iGrame]||"").trim().replace(",",".") : String(row[1]||"").trim().replace(",",".");
    const grams = Number(gramsRaw);
    if (!name || !gramsRaw || isNaN(grams) || grams<=0){ invalid++; continue; }
    const ing = all.find(x=> normText(x.ro)===normText(name) || normText(x.inci)===normText(name));
    if (!ing){ unknown++; unknownNames.push(name); continue; }
    if (inRecipe.has(ing.id)){ duplicate++; continue; }
    r.items.push({id:uid(), ingId: ing.id, grams, price: defaultPrice(ing.id)});
    inRecipe.add(ing.id);
    added++;
  }
  persistRecipes();
  renderMain();
  let msg = `Import în rețeta „${r.name}" finalizat:\n• ${added} ingrediente adăugate\n• ${duplicate} deja erau în rețetă (ignorate, ca să nu se suprapună)\n• ${invalid} rânduri incomplete (nume/grame lipsă)`;
  if (unknown>0) msg += `\n• ${unknown} ingrediente necunoscute (nu există în bază — adaugă-le mai întâi din tab-ul „Ingrediente"): ${unknownNames.slice(0,8).join(", ")}${unknownNames.length>8?"…":""}`;
  alert(msg);
}

    batches: state.batches,
    customIngredients,
    products,
    ingredientPrices,
    stock,
    costState,
    sales,
    lyeState,
  };
  downloadText(`backup-formulator-natural-${todayISO()}.json`, JSON.stringify(data, null, 2), "application/json");
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(String(reader.result));
      if (!confirm("Import backup: toate datele curente din aplicație vor fi înlocuite cu cele din fișier. Continui?")) return;
      if (Array.isArray(d.recipes) && d.recipes.length) state.recipes = d.recipes;
      if (Array.isArray(d.batches)) state.batches = d.batches;
      if (Array.isArray(d.customIngredients)) customIngredients = d.customIngredients;
      if (Array.isArray(d.products)) products = d.products;
      if (d.ingredientPrices) ingredientPrices = d.ingredientPrices;
      if (d.stock) stock = d.stock;
      if (d.costState) costState = d.costState;
      if (Array.isArray(d.sales)) sales = d.sales;
      if (d.lyeState) lyeState = d.lyeState;
      state.activeRecipeId = state.recipes[0] ? state.recipes[0].id : null;
      persistRecipes(); persistBatches(); persistCustom(); persistProducts();
      persistPrices(); persistStock(); persistSales(); persistLye();
      scheduleApiSave();
      render();
      alert("Backup importat cu succes.");
    }catch(e){
      alert("Fișierul nu pare a fi un backup valid: "+e.message);
    }
  };
  reader.readAsText(file);
}
