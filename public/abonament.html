<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abonament — Herbatium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="authCard" style="max-width:420px">
  <h1>Abonament lunar</h1>
  <div class="sub">Acces complet la Herbatium — rețete, listă INCI, verificare restricții UE, cost și poze de produs.</div>

  <div class="priceLine">
    <span>Abonament lunar</span>
    <span class="amt" id="priceAmt">—</span>
  </div>
  <ul class="features">
    <li>Rețete și ingrediente nelimitate</li>
    <li>Sincronizare pe orice dispozitiv</li>
    <li>Poze de produs</li>
    <li>Anulezi oricând, din contul tău</li>
  </ul>

  <button class="btn" id="subscribeBtn">Abonează-te acum</button>
  <button class="btn ghost" id="logoutBtn" style="margin-top:8px">Deconectare</button>
  <div class="err" id="errBox"></div>
</div>
<script>
async function api(path, opts){
  return fetch(path, {
    method: (opts && opts.method) || "GET",
    headers: opts && opts.body ? {"Content-Type":"application/json"} : undefined,
    body: opts && opts.body,
    credentials:"same-origin",
  });
}

(async function init(){
  const meRes = await api("/api/auth/me");
  if (meRes.status === 401){ window.location.href = "/login.html"; return; }
  const me = await meRes.json();
  if (me.subscriptionActive){ window.location.href = "/app.html"; return; }

  try{
    const priceRes = await api("/api/billing/price");
    if (priceRes.ok){
      const p = await priceRes.json();
      const amt = (p.amount/100).toFixed(2);
      document.getElementById("priceAmt").textContent = amt + " " + p.currency.toUpperCase() + " / lună";
    } else {
      document.getElementById("priceAmt").textContent = "vezi la plată";
    }
  }catch(e){
    document.getElementById("priceAmt").textContent = "vezi la plată";
  }
})();

document.getElementById("subscribeBtn").onclick = async ()=>{
  const btn = document.getElementById("subscribeBtn");
  const errBox = document.getElementById("errBox");
  errBox.style.display = "none";
  btn.disabled = true; btn.textContent = "Se pregătește plata…";
  try{
    const res = await api("/api/billing/checkout", {method:"POST"});
    if (!res.ok) throw new Error("checkout_failed");
    const {url} = await res.json();
    window.location.href = url; // redirect către Stripe Checkout
  }catch(e){
    errBox.textContent = "Nu am putut porni plata. Verifică dacă STRIPE_PRICE_ID e configurat corect pe server.";
    errBox.style.display = "block";
    btn.disabled = false; btn.textContent = "Abonează-te acum";
  }
};
document.getElementById("logoutBtn").onclick = async ()=>{
  await api("/api/auth/logout", {method:"POST"});
  window.location.href = "/login.html";
};
</script>
</body>
</html>
