<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autentificare — Herbatium</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f9d5a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="authCard">
  <h1>Autentificare</h1>
  <div class="sub">Intră în contul tău Herbatium.</div>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">
    <label for="password">Parolă</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button class="btn" type="submit" id="submitBtn">Conectare</button>
  </form>
  <form id="twofaForm" style="display:none">
    <label for="twofaCode">Cod de autentificare în doi factori</label>
    <input type="text" id="twofaCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456 (sau un cod de rezervă)" required>
    <div class="sub" style="margin:6px 0 0">Deschide aplicația de autentificare (Google Authenticator, Authy etc.) sau folosește unul dintre codurile de rezervă.</div>
    <button class="btn" type="submit" id="twofaSubmitBtn" style="margin-top:12px">Confirmă</button>
  </form>
  <div class="err" id="errBox"></div>
  <div class="foot">Nu ai cont încă? <a href="/register.html">Creează unul</a></div>
</div>
<script>
const form = document.getElementById("loginForm");
const twofaForm = document.getElementById("twofaForm");
const errBox = document.getElementById("errBox");
const submitBtn = document.getElementById("submitBtn");
const twofaSubmitBtn = document.getElementById("twofaSubmitBtn");
let pendingToken = null;

function showError(msg){
  errBox.textContent = msg;
  errBox.style.display = "block";
}

const LOGIN_ERRORS = {
  invalid_credentials: "Email sau parolă greșită.",
  too_many_attempts: "Prea multe încercări. Așteaptă câteva minute și încearcă din nou.",
};

form.onsubmit = async (e)=>{
  e.preventDefault();
  errBox.style.display = "none";
  submitBtn.disabled = true; submitBtn.textContent = "Se conectează…";
  try{
    const res = await fetch("/api/auth/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    const d = await res.json().catch(()=>({}));
    if (!res.ok){
      if (res.status === 423){
        showError(`Cont blocat temporar din cauza prea multor parole greșite. Încearcă din nou în aproximativ ${d.minutesLeft || 15} minute.`);
      } else {
        showError(LOGIN_ERRORS[d.error] || "A apărut o eroare. Încearcă din nou.");
      }
      submitBtn.disabled = false; submitBtn.textContent = "Conectare";
      return;
    }
    if (d.twoFactorRequired){
      pendingToken = d.pendingToken;
      form.style.display = "none";
      twofaForm.style.display = "block";
      document.getElementById("twofaCode").focus();
      submitBtn.disabled = false; submitBtn.textContent = "Conectare";
      return;
    }
    window.location.href = "/app.html";
  }catch(e){
    showError("Nu am putut contacta serverul.");
    submitBtn.disabled = false; submitBtn.textContent = "Conectare";
  }
};

twofaForm.onsubmit = async (e)=>{
  e.preventDefault();
  errBox.style.display = "none";
  twofaSubmitBtn.disabled = true; twofaSubmitBtn.textContent = "Se verifică…";
  try{
    const res = await fetch("/api/2fa/login-verify", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        pendingToken,
        code: document.getElementById("twofaCode").value,
      }),
    });
    if (!res.ok){
      const d = await res.json().catch(()=>({}));
      showError(d.error === "code_invalid" ? "Cod incorect. Încearcă din nou." : "Sesiunea de verificare a expirat — reia autentificarea.");
      twofaSubmitBtn.disabled = false; twofaSubmitBtn.textContent = "Confirmă";
      if (d.error === "pending_token_invalid_or_expired"){
        twofaForm.style.display = "none";
        form.style.display = "block";
      }
      return;
    }
    window.location.href = "/app.html";
  }catch(e){
    showError("Nu am putut contacta serverul.");
    twofaSubmitBtn.disabled = false; twofaSubmitBtn.textContent = "Confirmă";
  }
};
</script>
</body>
</html>
